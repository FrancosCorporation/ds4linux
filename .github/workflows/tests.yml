name: tests

permissions:
  contents: read

on:
  push:
    branches: [master, Version-1.0, version_2.0]
  pull_request:
  workflow_dispatch:

jobs:
  deb-package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Debian package
        run: packaging/deb/build-deb.sh dist

      - name: Inspect package metadata
        run: |
          package="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevdev2 libxcb-cursor0 libegl1
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Lint (ruff)
        run: ruff check src tests
